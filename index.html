<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Roman's Wish List 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=Lato:wght@400;700&display=swap">
<style>
/* Layout: a slim top bar with a spaced uppercase wordmark, then one reading column
   on a warm off-white ground. The list is a stack of white rows, serif titles,
   grey sans metadata, green actions. A small name card stands in front of it. */
:root {
  --bg: #F8F4EE;
  --panel: #FFFFFF;
  --ink: #212121;
  --meta: #6F6F6F;
  --line: #E3DED5;
  --green: #4F8A55;
  --green-ink: #FFFFFF;
  --warn: #9A5B13;
  --shadow: rgba(0, 0, 0, 0.08);
  --serif: "Warnock Pro", Palatino, "Palatino Linotype", "Book Antiqua", "Crimson Pro", Georgia, serif;
  --ui: "Gill Sans", "Gill Sans MT", Calibri, "Lato", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1F1F1F; --panel: #2A2A2A; --ink: #E4E4E4; --meta: #A3A3A3; --line: #3A3A3A;
    --green: #7FB685; --green-ink: #16210F; --warn: #E0A868; --shadow: rgba(0, 0, 0, 0.4);
    color-scheme: dark;
  }
}

*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--serif);
  font-size: 18px;
  line-height: 1.5;
}

.bar { background: var(--panel); box-shadow: 0 1px 2px var(--shadow); padding-top: env(safe-area-inset-top, 0px); }
.bar-in {
  max-width: 44rem; margin-inline: auto; min-height: 3.4rem;
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.2rem 1rem;
  padding-block: 0.5rem;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.mark { font-family: var(--ui); font-size: 1.05rem; letter-spacing: 0.07em; text-transform: uppercase; }
.who { display: flex; align-items: baseline; gap: 0.8rem; font-family: var(--ui); font-size: 0.95rem; color: var(--meta); }

.page {
  max-width: 44rem; margin-inline: auto;
  display: flex; flex-direction: column; gap: 1.2rem;
  padding-block: 2rem 4rem;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* name card */
.login {
  width: 100%; max-width: 22rem; margin: 2rem auto 0;
  display: flex; flex-direction: column; gap: 1rem;
  padding: 1.5rem;
  background: var(--panel); border: 1px solid var(--line); border-radius: 3px;
}
.login h1 { margin: 0; font-size: 1.6rem; font-weight: 400; line-height: 1.2; }
.login form, .editor { display: flex; flex-direction: column; gap: 0.8rem; }
.field { display: flex; flex-direction: column; gap: 0.25rem; }
.field label { font-family: var(--ui); font-size: 0.85rem; color: var(--meta); }
.field select, .field input, .field textarea {
  width: 100%; min-width: 0; padding: 0.5rem 0.55rem;
  font-family: var(--ui); font-size: 1rem; line-height: 1.4; color: var(--ink);
  background: var(--panel); border: 1px solid var(--meta); border-radius: 3px;
}
.field textarea { resize: vertical; }
.hint { margin: 0; font-family: var(--ui); font-size: 0.85rem; color: var(--meta); }
.check { display: flex; align-items: center; gap: 0.5rem; font-family: var(--ui); font-size: 0.95rem; }
.actions { display: flex; align-items: center; gap: 1rem; }

/* list */
.intro { margin: 0; max-width: 36rem; }
.notice { margin: 0; font-family: var(--ui); font-size: 0.95rem; color: var(--meta); }
.notice.warn { color: var(--warn); }
.section { margin: 0.6rem 0 -0.4rem; font-size: 1.5rem; font-weight: 400; line-height: 1.2; }
.rows { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.row {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: start; gap: 0.7rem 1.5rem;
  padding: 1rem 1.1rem;
  background: var(--panel);
}
.row.editing { grid-template-columns: minmax(0, 1fr); }
.wish { min-width: 0; display: flex; flex-direction: column; gap: 0.3rem; }
.wish h3 { margin: 0; font-size: 1.25rem; font-weight: 400; line-height: 1.3; text-wrap: balance; }
.row.taken .wish h3 { color: var(--meta); text-decoration: line-through; text-decoration-thickness: 1px; }
.wish p { margin: 0; overflow-wrap: anywhere; }
.wish ol, .wish ul { margin: 0; padding-left: 1.3rem; display: flex; flex-direction: column; gap: 0.1rem; }
.wish a { color: var(--green); text-underline-offset: 0.15em; overflow-wrap: anywhere; }
.claim { min-width: 0; max-width: 14rem; display: flex; flex-direction: column; align-items: flex-end; gap: 0.4rem; text-align: right; }
.tools { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 0.3rem 0.9rem; }
.status { margin: 0; font-family: var(--ui); font-size: 0.95rem; color: var(--ink); overflow-wrap: anywhere; }
.flash { margin: 0; font-family: var(--ui); font-size: 0.85rem; color: var(--warn); }

button { font: inherit; cursor: pointer; }
.btn, .act {
  font-family: var(--ui); font-size: 0.82rem; letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap;
  padding: 0.55rem 0.9rem; border-radius: 3px; border: 1px solid var(--green);
}
.btn { background: var(--green); color: var(--green-ink); align-self: flex-start; }
.act { background: transparent; color: var(--green); align-self: flex-start; }
.act:hover { background: var(--green); color: var(--green-ink); }
.claim .act { align-self: auto; }
.btn[disabled], .act[disabled], .link[disabled] { opacity: 0.5; cursor: default; }
.link {
  padding: 0; background: none; border: 0;
  font-family: var(--ui); font-size: 0.9rem; color: var(--meta);
  text-decoration: underline; text-underline-offset: 0.15em;
}
.link:hover { color: var(--ink); }
:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }

@media (max-width: 560px) {
  .row { grid-template-columns: minmax(0, 1fr); }
  .claim { max-width: none; align-items: flex-start; text-align: left; }
  .tools { justify-content: flex-start; }
}
</style>
</head>
<body>

<div class="bar">
  <div class="bar-in">
    <span class="mark">Roman's Wish List</span>
    <span class="who" id="who"></span>
  </div>
</div>
<main class="page" id="app"></main>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="app.js"></script>
</body>
</html>
